name: CI

# Typecheck, unit tests, and the invariant smoke test that drives the real app.
#
# The smoke test is here because `npm test` has never caught a serious bug in
# this codebase — every defect that shipped compiled cleanly and passed the unit
# suite. See scripts/smoke.mjs.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck + build (renderer)
        run: npm run build

      - name: Compile Electron main/preload
        run: npm run electron:compile

      - name: Unit tests
        run: npm test

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Invariant smoke test
        run: npm run smoke:ci
